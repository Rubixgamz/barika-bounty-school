services:
  - type: web
    name: barika-bounty-school
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: barika-bounty-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: BARIKA_DATA_FILE
        value: /var/data/barika-data.json
      - key: BARIKA_ADMIN_EMAIL
        sync: false
      - key: BARIKA_ADMIN_PASSWORD
        sync: false
